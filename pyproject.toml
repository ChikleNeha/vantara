[tool.ruff]
line-length = 150
target-version = "py311"
extend-exclude = ["frontend", "models_artifacts", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP037", "UP040", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["src", "api"]
